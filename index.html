<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Run Predictor Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <link
      rel="touch-icon"
      href="https://egehomburg-stack.github.io/logo1.png?v=5"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="logo1.png" />
  </head>
  <body class="bg-[#0a253e] font-sans text-slate-200 min-h-screen">
    <!-- Onboarding Modal -->
    <div
      id="onboarding"
      class="fixed inset-0 bg-[#0a253e] z-[60] flex items-center justify-center p-4"
    >
      <div
        class="bg-slate-800 p-8 rounded-[2rem] shadow-2xl max-w-md w-full border border-slate-700"
      >
        <h2 class="text-2xl font-bold text-white mb-6 text-center">
          Set Your Profile
        </h2>
        <div class="space-y-4">
          <div>
            <label class="block text-slate-400 text-sm mb-1">Gender</label>
            <select
              id="gender"
              class="w-full bg-slate-700 text-white p-3 rounded-xl border-none outline-none"
            >
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 text-sm mb-1">Sweat Rate</label>
            <select
              id="sweatRate"
              class="w-full bg-slate-700 text-white p-3 rounded-xl border-none outline-none"
            >
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high" selected>High</option>
            </select>
          </div>

          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-slate-400 text-sm mb-1">Age</label>
              <input
                type="number"
                id="age"
                value="22"
                class="w-full bg-slate-700 text-white p-2 rounded-xl border-none outline-none"
              />
            </div>
            <div>
              <label class="block text-slate-400 text-sm mb-1"
                >Weight (kg)</label
              >
              <input
                type="number"
                id="weight"
                value="73"
                class="w-full bg-slate-700 text-white p-2 rounded-xl border-none outline-none"
              />
            </div>
            <div>
              <label class="block text-slate-400 text-sm mb-1"
                >Height (cm)</label
              >
              <input
                type="number"
                id="height"
                value="183"
                class="w-full bg-slate-700 text-white p-2 rounded-xl border-none outline-none"
              />
            </div>
          </div>
          <button
            onclick="saveProfile()"
            class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition-all mt-4"
          >
            Save & Start
          </button>
        </div>
      </div>
    </div>

    <div id="mainAppContent" class="hidden">
      <div
        id="graphsPage"
        class="page-content hidden min-h-screen flex items-center justify-center"
      >
        <h1
          class="text-white text-4xl font-bold tracking-widest uppercase opacity-20"
        >
          Hello
        </h1>
      </div>

      <div
        id="preparePage"
        class="page-content hidden min-h-screen flex items-center justify-center"
      >
        <h1
          class="text-white text-4xl font-bold tracking-widest uppercase opacity-20"
        >
          Ciao
        </h1>
      </div>

      <!-- Input Fields (Manually Entered Values) -->
      <div id="predictorPage" class="page-content min-h-screen pb-24 p-6">
        <div class="max-w-md mx-auto p-6 pt-12">
          <div class="space-y-5">
            <!-- Sleep (Hours & Minutes) -->
            <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700">
              <label class="block text-slate-400 font-medium text-sm mb-2">
                Sleep
                <span
                  onclick="showInfo('sleep')"
                  class="text-[11px] text-slate-500 font-normal ml-2 italic cursor-pointer hover:underline hover:text-blue-400 transition-colors"
                >
                  (Ideal: 8h30m-9h30m)
                </span>
              </label>

              <div class="flex items-center gap-2">
                <input
                  type="number"
                  id="sleepHours"
                  data-save="sleepHours"
                  data-daily
                  value="0"
                  min="0"
                  max="12"
                  class="w-full bg-slate-700 text-blue-400 font-bold p-3 rounded-xl border-none outline-none focus:ring-2 focus:ring-blue-500 text-lg text-center"
                  oninput="runPredictor()"
                />
                <span class="text-slate-500 font-bold">h</span>
                <input
                  type="number"
                  id="sleepMins"
                  data-save="sleepMins"
                  data-daily
                  value="0"
                  min="0"
                  max="59"
                  step="10"
                  class="w-full bg-slate-700 text-blue-400 font-bold p-3 rounded-xl border-none outline-none focus:ring-2 focus:ring-blue-500 text-lg text-center"
                  oninput="runPredictor()"
                />
                <span class="text-slate-500 font-bold">m</span>
              </div>
            </div>

            <!-- Temperature -->
            <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700">
              <label class="block text-slate-400 font-medium text-sm mb-2"
                >Temperature (°C)<span
                  onclick="showInfo('temp')"
                  class="text-[11px] text-slate-500 font-normal ml-2 italic cursor-pointer hover:underline hover:text-blue-400 transition-colors"
                  >(Ideal: 3.8-9.9 °C)</span
                ></label
              >
              <input
                type="number"
                id="temperature"
                data-save="temperature"
                value="20"
                step="1"
                class="w-full bg-slate-700 text-blue-400 font-bold p-3 rounded-xl border-none outline-none focus:ring-2 focus:ring-blue-500 text-lg"
                oninput="runPredictor()"
              />
            </div>

            <!-- Calories -->
            <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700">
              <label class="block text-slate-400 font-medium text-sm mb-2"
                >Calories Eaten<span
                  id="idealCalHint"
                  onclick="showInfo('cal')"
                  class="text-[11px] text-slate-500 font-normal ml-2 italic cursor-pointer hover:underline hover:text-blue-400 transition-colors"
                  >(Ideal: -- kcal)</span
                >
              </label>
              <input
                type="number"
                id="caloriesInput"
                data-save="caloriesInput"
                data-daily
                value="0"
                step="1"
                class="w-full bg-slate-700 text-blue-400 font-bold p-3 rounded-xl border-none outline-none focus:ring-2 focus:ring-blue-500 text-lg"
                oninput="runPredictor()"
              />
            </div>

            <!-- Hydration Input -->
            <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700">
              <label class="block text-slate-400 font-medium text-sm mb-2"
                >Hydration (L)<span
                  id="idealWaterHint"
                  onclick="showInfo('water')"
                  class="text-[11px] text-slate-500 font-normal ml-2 italic cursor-pointer hover:underline hover:text-blue-400 transition-colors"
                  >(Ideal: -- L)</span
                ></label
              >
              <input
                type="number"
                id="hydrationInput"
                data-save="hydrationInput"
                data-daily
                step="0.1"
                value="0"
                class="w-full bg-slate-700 text-blue-400 font-bold p-3 rounded-xl border-none outline-none focus:ring-2 focus:ring-blue-500 text-lg"
                oninput="runPredictor()"
              />
            </div>

            <!-- Altitude Input -->
            <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700">
              <label class="block text-slate-400 font-medium text-sm mb-2"
                >Altitude (m)<span
                  id="idealAltHint"
                  onclick="showInfo('alt')"
                  class="text-[11px] text-slate-500 font-normal ml-2 italic cursor-pointer hover:underline hover:text-blue-400 transition-colors"
                  >(Ideal: 0-900m)</span
                >
              </label>
              <input
                type="number"
                id="altitudeInput"
                data-save="altitudeInput"
                value="500"
                class="w-full bg-slate-700 text-blue-400 font-bold p-3 rounded-xl border-none outline-none focus:ring-2 focus:ring-blue-500 text-lg"
                oninput="runPredictor()"
              />
            </div>

            <!-- Goal Distance -->
            <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700">
              <label class="block text-slate-400 font-medium text-sm mb-2"
                >Goal Distance (km)</label
              >
              <input
                type="number"
                id="distance"
                value="0"
                step="0.5"
                class="w-full bg-slate-700 text-blue-400 font-bold p-3 rounded-xl border-none outline-none focus:ring-2 focus:ring-blue-500 text-lg"
                oninput="runPredictor()"
              />
            </div>

            <!-- Stretching Toggle -->
            <div
              class="bg-slate-800 p-5 rounded-3xl border border-slate-700 flex justify-between items-center"
            >
              <span class="text-slate-400 font-medium text-sm"
                >Did you stretch?</span
              >
              <input
                type="checkbox"
                id="stretching"
                class="w-6 h-6 rounded-lg accent-blue-600"
                onchange="runPredictor()"
              />
            </div>
          </div>

          <!-- Main Content -->

          <div class="text-center mb-8">
            <p class="text-slate-400 text-lg">Predicted Quality</p>
            <h1
              id="qualityText"
              class="text-7xl font-black text-blue-400 mt-2 italic"
            >
              --%
            </h1>
          </div>

          <!-- Chart Container -->
          <div
            class="relative bg-slate-800/50 p-4 rounded-[2.5rem] mb-10 border border-slate-700 aspect-square flex items-center justify-center"
          >
            <canvas id="myChart"></canvas>
          </div>

          <!-- Reset Button -->
          <div class="mt-8 text-center pb-10">
            <button
              onclick="resetProfile()"
              class="text-slate-500 text-xs hover:text-white underline uppercase tracking-widest"
            >
              Reset Profile
            </button>
          </div>
        </div>
      </div>
      <div id="trackPage" class="page-content hidden min-h-screen p-6">
        <h2 class="text-2xl font-bold text-white mb-6">Activity Tracking</h2>

        <!-- Big "Add Run" Button -->
        <button
          onclick="toggleModal()"
          class="w-full bg-slate-800 p-5 rounded-3xl border border-slate-700 mb-4 flex items-center justify-between group active:scale-[0.98] transition-all"
        >
          <div class="flex items-center gap-4">
            <!-- 1. The Glowing Runner Icon -->
            <div
              class="p-[1.5px] rounded-2xl bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 shrink-0"
            >
              <div
                class="bg-slate-800 w-14 h-14 flex items-center justify-center rounded-[15px]"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="w-8 h-8 text-white"
                >
                  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                  <path d="M11.007 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                  <path d="M4 17l5 1l.75 -1.5" />
                  <path d="M15 21v-4l-4 -3l1 -6" />
                  <path d="M7 12v-3l5 -1l3 3l3 1" />
                </svg>
              </div>
            </div>
            <div class="text-left">
              <span class="block text-white font-bold text-lg"
                >Add New Run</span
              >
              <span class="block text-slate-400 text-sm italic"
                >Log your latest performance</span
              >
            </div>
          </div>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-slate-500 group-hover:text-blue-400 transition-colors"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            />
          </svg>
        </button>

        <!-- Big "Water" Button -->
        <button
          onclick="toggleWaterModal()"
          class="w-full bg-slate-800 p-5 rounded-3xl border border-slate-700 mb-4 transition-all active:scale-95 group"
        >
          <!-- Top Row: Icon, Text, and Arrow -->
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-4">
              <!-- Your Glowing Water Icon Container -->
              <div
                class="p-[1.5px] rounded-2xl bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 shrink-0"
              >
                <div
                  class="bg-slate-800 w-14 h-14 flex items-center justify-center rounded-[13px]"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-bottle"
                  >
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M10 5h4v-2a1 1 0 0 0 -1 -1h-2a1 1 0 0 0 -1 1v2" />
                    <path
                      d="M14 3.5c0 1.626 .507 3.212 1.45 4.537l.05 .07a8.093 8.093 0 0 1 1.5 4.694v6.199a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2v-6.2c0 -1.682 .524 -3.322 1.5 -4.693l.05 -.07a7.823 7.823 0 0 0 1.45 -4.537"
                    />
                    <path
                      d="M7 14.803a2.4 2.4 0 0 0 1 -.803a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 1 -.805"
                    />
                  </svg>
                </div>
              </div>
              <div class="text-left">
                <span class="block text-white font-bold text-lg">Water</span>
                <span id="waterText" class="text-slate-400 text-xs font-mono"
                  >0 / 3000 ml</span
                >
                <div
                  id="waterCheckmark"
                  class="hidden md:hidden text-emerald-500"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M5 12l5 5l10 -10" />
                  </svg>
                </div>
              </div>
            </div>

            <!-- The Arrow from your line 380 -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 text-slate-500 group-hover:text-blue-400 transition-colors"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </div>

          <!-- Bottom Row: The Progress Bar -->
          <div class="w-full h-2 bg-slate-900 rounded-full overflow-hidden">
            <div
              id="waterProgressBar"
              class="h-full bg-green-500 transition-all duration-500"
              style="width: 0%"
            ></div>
          </div>
        </button>

        <!-- Eat Activity Card (Mobile) - EXACT MATCH -->
        <button
          onclick="toggleEatModal()"
          class="w-full bg-slate-800 p-5 rounded-3xl border border-slate-700 mb-4 transition-all active:scale-95 group text-left"
        >
          <!-- Top Row: Icon, Text, and Arrow -->
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-4">
              <!-- Thick Glowing Gradient Border (Emerald/Green/Lime) -->
              <div
                class="p-[1.5px] rounded-2xl bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 shrink-0"
              >
                <div
                  class="bg-slate-800 w-14 h-14 flex items-center justify-center rounded-[13px]"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-meat"
                  >
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path
                      d="M13.62 8.382l1.966 -1.967a2 2 0 1 1 3.414 -1.415a2 2 0 1 1 -1.413 3.414l-1.82 1.821"
                    />
                    <path
                      d="M5.904 18.596c2.733 2.734 5.9 4 7.07 2.829c1.172 -1.172 -.094 -4.338 -2.828 -7.071c-2.733 -2.734 -5.9 -4 -7.07 -2.829c-1.172 1.172 .094 4.338 2.828 7.071"
                    />
                    <path d="M7.5 16l1 1" />
                    <path
                      d="M12.975 21.425c3.905 -3.906 4.855 -9.288 2.121 -12.021c-2.733 -2.734 -8.115 -1.784 -12.02 2.121"
                    />
                  </svg>
                </div>
              </div>

              <div>
                <span class="block text-white font-bold text-lg leading-tight"
                  >Nutrition</span
                >
                <div class="flex items-center gap-2">
                  <span
                    id="currentCalText"
                    class="text-slate-400 text-xs font-mono"
                    >0 / 2000 kcal</span
                  >
                  <!-- The Checkmark -->
                  <div id="eatCheckmark" class="hidden text-emerald-500">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="4"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                      <path d="M5 12l5 5l10 -10" />
                    </svg>
                  </div>
                </div>
              </div>
            </div>

            <!-- The Arrow -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 text-slate-500 group-hover:text-green-400 transition-colors"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </div>

          <!-- Bottom Row: The Progress Bar (Taller height to match Water) -->
          <div class="w-full h-2 bg-slate-900 rounded-full overflow-hidden">
            <div
              id="eatProgressBar"
              class="h-full bg-green-500 transition-all duration-500"
              style="width: 0%"
            ></div>
          </div>
        </button>
      </div>
      <div id="trackPage" class="page-content hidden">
        <h2 class="text-center mt-20 text-slate-400">
          Run Tracking coming soon...
        </h2>
      </div>

      <div
        id="zonesPage"
        class="page-content hidden min-h-screen flex items-center justify-center"
      >
        <h1
          class="text-white text-4xl font-bold tracking-widest uppercase opacity-20"
        >
          Zone
        </h1>
      </div>
      <!-- Bottom Navigation Bar -->
      <nav
        class="md:hidden fixed bottom-0 left-0 right-0 bg-[#0f172a] border-t border-slate-800 flex items-center h-20 pb-2 z-50"
      >
        <!-- Graphs Tab -->
        <button
          onclick="showPage('graphsPage')"
          class="flex-1 flex flex-col items-center justify-center gap-1 text-slate-400 transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="w-6 h-6"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M3 3v18h18" />
            <path d="M20 18v3" />
            <path d="M16 16v5" />
            <path d="M12 13v8" />
            <path d="M8 16v5" />
            <path d="M3 11c6 0 5 -5 9 -5s3 5 9 5" />
          </svg>
          <span class="text-[10px] uppercase tracking-widest">Graphs</span>
        </button>

        <!-- Vertical Divider -->
        <div class="h-10 w-[1px] bg-slate-800"></div>

        <!-- Prepare Tab -->
        <button
          onclick="showPage('preparePage')"
          class="flex-1 flex flex-col items-center justify-center gap-1 text-slate-400 transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-target-arrow"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
            <path d="M12 7a5 5 0 1 0 5 5" />
            <path d="M13 3.055a9 9 0 1 0 7.941 7.945" />
            <path d="M15 6v3h3l3 -3h-3v-3l-3 3" />
            <path d="M15 9l-3 3" />
          </svg>
          <span class="text-[10px] uppercase tracking-widest">Prepare</span>
        </button>

        <!-- Vertical Divider -->
        <div class="h-10 w-[1px] bg-slate-800"></div>

        <!-- Predictor Tab -->
        <button
          onclick="showPage('predictorPage')"
          class="flex-1 flex flex-col items-center justify-center gap-1 text-blue-400 font-bold"
        >
          <div class="w-6 h-6 flex items-center justify-center">
            <div
              class="w-2 h-2 bg-blue-400 rounded-full shadow-[0_0_10px_#60a5fa]"
            ></div>
          </div>
        </button>

        <!-- Vertical Divider -->
        <div class="h-10 w-[1px] bg-slate-800"></div>

        <!-- Track Tab -->
        <button
          onclick="showPage('trackPage')"
          class="flex-1 flex flex-col items-center justify-center gap-1 text-slate-400 transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="w-6 h-6"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path
              d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2"
            />

    <script>
      let profile = null;
      let myChart = null;
      let idealCal = 2000;
      let html5QrCode;

      function checkDailyReset() {
        // 1. Get the profile to make sure we don't break the setup flow
        const profile = JSON.parse(localStorage.getItem("runnerProfile"));
        if (!profile) return; // Exit if user hasn't finished setup!

        const today = new Date().toDateString();
        const lastSavedDate = localStorage.getItem("lastSavedDate");

        // 2. Check if a new day has passed
        if (lastSavedDate && lastSavedDate !== today) {
          console.log("New day detected! Resetting logs...");

          totalWaterDrank = 0;
          totalCaloriesEaten = 0;

          localStorage.setItem("totalWaterDrank", 0);
          localStorage.setItem("totalCaloriesEaten", 0);

          // Sync UI
          if (typeof updateWaterUI === "function") updateWaterUI();
          if (typeof updateEatUI === "function") updateEatUI();
        }

        // 3. Always update the date so the next check works
        localStorage.setItem("lastSavedDate", today);
      }

      // 1. Initial Load Logic
      window.onload = function () {
        const saved = localStorage.getItem("runProfileData");
        if (saved) {
          profile = JSON.parse(saved);
          document.getElementById("onboarding").classList.add("hidden");
          // Show the app if data already exists
          document.getElementById("mainAppContent").classList.remove("hidden");
          runPredictor();
        }
      };

      // 2. Profile Management
      function saveProfile() {
        profile = {
          gender: document.getElementById("gender").value,
          sweatRate: document.getElementById("sweatRate").value,
          age: parseFloat(document.getElementById("age").value),
          weight: parseFloat(document.getElementById("weight").value),
          height: parseFloat(document.getElementById("height").value),
        };

        localStorage.setItem("runProfileData", JSON.stringify(profile));

        // 1. Hide the setup screen
        document.getElementById("onboarding").classList.add("hidden");

        // 2. UNLOCK the main app content (Add this line!)
        document.getElementById("mainAppContent").classList.remove("hidden");

        runPredictor();
      }

      function showPage(pageId) {
        // 1. Hide all pages
        document.querySelectorAll(".page-content").forEach((page) => {
          page.classList.add("hidden");
        });

        // 2. Show the target page
        const targetPage = document.getElementById(pageId);
        if (targetPage) {
          targetPage.classList.remove("hidden");
        }

        // 3. Reset all nav buttons colors
        document.querySelectorAll("nav button").forEach((btn) => {
          btn.classList.remove("text-blue-400", "font-bold");
          btn.classList.add("text-slate-400");
        });

        // 4. Find the button that was clicked and light it up
        // We use 'target' or a simpler search to avoid the "null" error
        const clickedBtn = document.querySelector(
          `button[onclick*="${pageId}"]`,
        );

        if (clickedBtn) {
          clickedBtn.classList.replace("text-slate-400", "text-blue-400");
          clickedBtn.classList.add("font-bold");
        }

        window.scrollTo(0, 0);
      }

      function resetProfile() {
        localStorage.removeItem("runProfileData");
        document.getElementById("onboarding").classList.remove("hidden");
      }

      // 3. Main Calculation Logic
      function runPredictor() {
        if (!profile) return;

        const h = parseFloat(document.getElementById("sleepHours").value) || 0;
        const m = parseFloat(document.getElementById("sleepMins").value) || 0;
        const sleep = h + m / 60;

        const dist = parseFloat(document.getElementById("distance").value) || 0;
        const cal =
          parseFloat(document.getElementById("caloriesInput").value) || 0;
        const temp =
          parseFloat(document.getElementById("temperature").value) || 0;
        const stretched = document.getElementById("stretching").checked;
        const water =
          parseFloat(document.getElementById("hydrationInput").value) || 0;
        const alt =
          parseFloat(document.getElementById("altitudeInput").value) || 0;

        totalWaterDrank = Math.round(water * 1000); // Sync liters to global ml
        localStorage.setItem("totalWaterDrank", totalWaterDrank); // Save it!

        // Ideal Cal Formula
        const s = profile.gender === "male" ? 5 : -161;
        const bmr =
          10 * profile.weight + 6.25 * profile.height - 5 * profile.age + s;
        idealCal = bmr * 1.5 + profile.weight * dist;
        localStorage.setItem("userIdealCal", idealCal);
        document.getElementById("idealCalHint").innerText =
          `(Ideal: ${Math.round(idealCal)} kcal)`;
        updateEatUI();

        // Ideal Hydration Formula
        const sweatMap = { low: 0.7, medium: 1.0, high: 1.4 };
        const sMult = sweatMap[profile.sweatRate] || 1.0;

        let baselineWater = profile.weight * 0.035;
        if (profile.gender.toLowerCase() === "male") baselineWater *= 1.1;

        let runLoss = dist * 0.1 * sMult;
        {
          runLoss *= 1 + (temp - 20) * 0.05;
        }

        // Full-day hydration target
        const dailyWaterTarget = baselineWater + runLoss;
        localStorage.setItem("dailyWaterGoal", dailyWaterTarget);
        updateWaterUI(dailyWaterTarget);

        // Get the user's local time
        const now = new Date();
        const timeNow = now.getHours() + now.getMinutes() / 60;

        // Hydration day: 07:00–22:00
        const startHour = 7;
        const endHour = 22;
        const activeHours = endHour - startHour;

        // Work out how much of the day has passed
        const elapsedHours = Math.max(
          0,
          Math.min(timeNow - startHour, activeHours),
        );

        const dayProgress = elapsedHours / activeHours;

        // Ideal hydration amount by the current time
        const idealWater = dailyWaterTarget * dayProgress;

        // Update the label
        document.getElementById("idealWaterHint").innerText =
          `(Ideal by now: ${idealWater.toFixed(1)} L)`;

        // 1. Grab the value currently typed in the predictor box
        const calInput = document.getElementById("caloriesInput");
        if (calInput) {
          // Update our global variable with what the user just typed
          totalCaloriesEaten = parseInt(calInput.value) || 0;

          // Save it so it's remembered if they refresh
          localStorage.setItem("totalCaloriesEaten", totalCaloriesEaten);

          // 2. Trigger the Nutrition UI (Green bars/rings) to update
          // We wrap this in a check to make sure the function exists
          if (typeof updateEatUI === "function") updateEatUI();
        }

        // Scoring Logic
        // Baseline Performance starts at 1.0 (100%)
        let multiplier = 1.0;

        // Sleep Multiplier (Ideal 8.5h - 9.5h)
        let sleepFactor = 1.0;
        if (sleep < 8.5) {
          // Lose roughly 5% for every hour of sleep missing
          sleepFactor = 1.0 - (8.5 - sleep) * 0.05;
        } else if (sleep > 9.5) {
          // Too much sleep also makes you groggy
          sleepFactor = 1.0 - (sleep - 9.5) * 0.02;
        }
        multiplier *= Math.max(0.6, sleepFactor); // Can't lose more than 40% from sleep

        // Temperature Multiplier (Ideal 12°C - 20°C)
        let tempFactor = 1.0;
        if (temp > 9.9) {
          // Heat is dangerous! Lose 2% for every degree over 20
          tempFactor = 1.0 - (temp - 9.9) * 0.025;
        } else if (temp < 3.8) {
          // Cold is easier, lose 1% for every degree under 12
          tempFactor = 1.0 - (3.8 - temp) * 0.015;
        }
        multiplier *= Math.max(0.4, tempFactor);

        // Calories Multiplier (Fuel Factor)
        // We compare what you ate to your ideal BMR
        let calRatio = cal / idealCal;
        let calFactor = 1.0;

        if (calRatio < 0.8) {
          // Under-fueled: Lose 5% for every 10% you are under the 80% mark
          calFactor = 1.0 - (0.8 - calRatio) * 0.5;
        } else if (calRatio > 1.2) {
          // Over-fueled: Too full! Lose 2% for every 10% you are over the 120% mark
          calFactor = 1.0 - (calRatio - 1.2) * 0.2;
        }

        // Floor it at 0.6 (Even hungry, you can run, but it'll be slow)
        multiplier *= Math.max(0.6, calFactor);

        // Hydration Multiplier (Penalty if under-hydrated)
        let hydrationFactor = 1.0;
        const hydrationDeficit = idealWater - water;

        if (hydrationDeficit > 0) {
          // Lose 10% performance for every Liter missing
          hydrationFactor = 1.0 - hydrationDeficit * 0.1;
        }

        // Don't let the factor go below 0.5 (50% performance)
        hydrationFactor = Math.max(0.5, hydrationFactor);
        multiplier *= hydrationFactor;

        // Altitude Multiplier (Penalty kicks in above 1500m)
        let altFactor = 1.0;
        if (alt > 1500) {
          altFactor = 1.0 - ((alt - 1500) / 100) * 0.015; // 1.5% drop per 100m
        }
        multiplier *= Math.max(0.6, altFactor);

        let stretchMultiplier = stretched ? 1.05 : 1.0;
        multiplier *= stretchMultiplier;

        let finalScore = Math.round(multiplier * 100);
        document.getElementById("qualityText").innerText = finalScore + "%";

        updateChart(sleep, temp, cal, idealCal, water, idealWater, alt);
      }

        } else if (temp >= -9.0 && temp <= 30) {

        } else if (temp >= -11.5 && temp <= 34) {

        } else if (temp >= -14.0 && temp <= 38) {
          tempP = 30; // Miserable
        } else {
          tempP = 20; // Catastrophic
        }

        let calP;
        const calDiff = Math.abs(cal - idealCal);
        if (calDiff < 100) {
          calP = 100;
        } else if (calDiff < 300) {
          calP = 90;
        } else if (calDiff < 500) {

        let waterP;

        }

        let altP;
        if (alt <= 900) {

        } else if (alt <= 1200) {

        } else if (alt <= 1800) {
          altP = 70;
        } else if (alt <= 2000) {

        } else if (alt <= 2500) {

        } else {
          altP = 20;
        }

        // Colors
        let sleepColor;
        if (sleep >= 8.5 && sleep <= 9.5)
          sleepColor = "rgba(13, 179, 158, 0.8)"; // Perfect

        else if (sleep >= 7.5 && sleep <= 10.3)
          sleepColor = "rgba(131, 227, 119, 0.8)"; // Great
        else if (sleep >= 7 && sleep <= 10.5)

        else if (sleep >= 6 && sleep <= 11.3)

        else if (sleep >= 5.5 && sleep <= 11.5)
          sleepColor = "rgba(250, 121, 33, 0.8)"; // Bad
        else if (sleep >= 5 && sleep <= 11.7)
          sleepColor = "rgba(229, 89, 52, 0.8)"; // Miserable
        else sleepColor = "rgba(220, 38, 38, 0.8)"; // Catastrophic

        // Calories Color
        let calColor;

        if (calDiff < 100)
          calColor = "rgba(13, 179, 158, 0.8)"; // Perfect
        else if (calDiff < 300)
          calColor = "rgba(22, 219, 147, 0.8)"; // Fantastic
        else if (calDiff < 500)
          calColor = "rgba(131, 227, 119, 0.8)"; // Great
        else if (calDiff < 700)
          calColor = "rgba(185, 231, 105, 0.8)"; // Good
        else if (calDiff < 900)
          calColor = "rgba(234, 179, 8, 0.8)"; // Decent
        else if (calDiff < 1100)
          calColor = "rgba(245, 158, 11, 0.8)"; // Poor
        else if (calDiff < 1300)
          calColor = "rgba(250, 121, 33, 0.8)"; // Bad
        else if (calDiff < 1500)
          calColor = "rgba(229, 89, 52, 0.8)"; // Miserable
        else calColor = "rgba(220, 38, 38, 0.8)"; // Catastrophic

        // Temperature Color
        let tempColor;

        if (temp >= 3.8 && temp <= 9.9)
          tempColor = "rgba(13, 179, 158, 0.8)"; // Perfect
        else if (temp >= 1.0 && temp <= 14)
          tempColor = "rgba(22, 219, 147, 0.8)"; // Fantastic
        else if (temp >= -1.5 && temp <= 18)

        else tempColor = "rgba(220, 38, 38, 0.8)"; // Catastrophic

        // Water Color
        let waterColor;

        if (waterDiff < 0.2) {
          waterColor = "rgba(13, 179, 158, 0.8)"; // Perfect (within 200ml)
        } else if (waterDiff < 0.5) {

        } else {
          waterColor = "rgba(220, 38, 38, 0.8)"; // Catastrophic
        }

        // Altitude Color
        let altColor;

        if (alt >= 0.0 && alt <= 900)

        myChart = new Chart(ctx, {

                backgroundColor: [
                  sleepColor,
                  tempColor,

                  waterColor,

                realValues: [

      // Explanations
      const explanations = {
        sleep:
          "8h30m-9h30m hours of sleep is the 'Goldilocks' zone for athletes. It's when your body repairs muscle tissue and releases growth hormones.",
        temp: "the 'sweet spot' for speed is between 3.8°C and 9.9°C. In this range, your body can shed heat efficiently without overworking your heart. For every degree above this, performance drops as blood is diverted from your muscles to your skin for cooling. \n\nSource: https://doi.org/10.1371/journal.pone.0037407",
        cal: "Your ideal calories are calculated based on your BMR (Age/Weight/Gender) plus the extra energy burned for your specific goal distance.",
        water:

      var totalWaterDrank = 0;

      var totalCaloriesEaten = 0;

      function toggleWaterModal() {
        const modal = document.getElementById("waterModal");
        if (modal) {
          modal.classList.toggle("hidden");

          // When the modal opens...
          if (!modal.classList.contains("hidden")) {
            // Check memory for previous bottle size
            const savedSize = localStorage.getItem("savedBottleSize");
            if (savedSize) {
              document.getElementById("bottleSize").value = savedSize;
              checkVolume(); // Unlock buttons if size was found
            }
            // Start count at 0
            bottles = 0;
            document.getElementById("bottleCount").innerText = "0";
          }
        }
      }
      function checkVolume() {
        const size = document.getElementById("bottleSize").value;
        const stepper = document.getElementById("stepperContainer");

        if (size > 0 && size !== "") {
          // 'flex' makes it appear and keeps the layout nice
          stepper.style.display = "flex";
          localStorage.setItem("savedBottleSize", size);
        } else {
          // 'none' removes it from the screen entirely
          stepper.style.display = "none";
        }
      }

      function updateWaterStepper(val) {
        bottles = Math.max(0, bottles + val);
        const countEl = document.getElementById("bottleCount");
        if (countEl) countEl.innerText = bottles;
      }

      function saveWater() {
        // 1. Get values from the modal inputs
        const sizeInput = document.getElementById("bottleSize");
        const manualInput = document.getElementById("manualWater");
        const countEl = document.getElementById("bottleCount");

        const size = parseFloat(sizeInput.value) || 0;
        const manual = parseFloat(manualInput.value) || 0;
        const bottleCount = parseInt(countEl.innerText) || 0;

        // 2. Calculate added amount (Bottles * Size + Manual)
        const addedAmount = size * bottleCount + manual;

        if (addedAmount > 0) {
          // 3. Update the total global variable
          totalWaterDrank += addedAmount;

            // Re-run the radar chart math automatically
            if (typeof runPredictor === "function") runPredictor();
          }

          // 5. Update all Water UI (bars, text, checkmark)
          updateWaterUI();
        }

        // 6. Reset Modal for next time
        sizeInput.value = localStorage.getItem("savedBottleSize") || "";
        manualInput.value = "";
        bottles = 0; // Reset internal counter
        countEl.innerText = "0";

      function updateWaterUI(liveGoal = null) {

          const savedGoal = localStorage.getItem("dailyWaterGoal");
          if (savedGoal) {
            goal = Math.round(parseFloat(savedGoal) * 1000);
          } else {
            // 3. Absolute fallback to profile/default
            const profile = JSON.parse(localStorage.getItem("runnerProfile"));
            const storedGoal =
              profile && profile.idealWater ? profile.idealWater : 2.5;
            goal = Math.round(storedGoal * 1000);
          }
        }

        // Safety check for tiny numbers
        if (goal < 100) goal = 2500;

        const percentage = Math.min(100, (totalWaterDrank / goal) * 100);

        // Update Mobile Bar
        const bar = document.getElementById("waterProgressBar");
        const text = document.getElementById("waterText");
        if (bar) bar.style.width = percentage + "%";
        if (text) text.innerText = `${totalWaterDrank} / ${goal} ml`;

        // Update Desktop Ring
        const borderDesktop = document.getElementById("waterBorderDesktop");
        if (borderDesktop) {
          borderDesktop.style.background = `conic-gradient(#22c55e 0% ${percentage}%, #3b82f6 ${percentage}%, #a855f7 70%, #ec4899 100%)`;

          modal.classList.remove("hidden");
          modal.classList.add("flex");
        } else {
          // CLOSING
          modal.classList.add("hidden");
          modal.classList.remove("flex");

          // 1. Kill the camera ONLY if it is actually running (State 2)
          if (html5QrCode && html5QrCode.getState() === 2) {
            html5QrCode.stop().catch(() => {});
          }

          // 2. RESET UI: Hide the KitKat card and bring back original buttons
          if (scanCard) {
            scanCard.classList.add("hidden");
            scanCard.style.display = "none";
          }

          if (scanBtn) scanBtn.classList.remove("hidden");

      function startScanner() {
        const readerDiv = document.getElementById("barcode-reader");
        readerDiv.classList.remove("hidden");

        // Initialize with barcode support
        html5QrCode = new Html5Qrcode("barcode-reader", {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.QR_CODE,
          ],
        });

        const config = {
          fps: 20,
          qrbox: { width: 280, height: 160 },
          aspectRatio: 1.0,
        };

        html5QrCode
          .start({ facingMode: "environment" }, config, (decodedText) => {
            // CRITICAL CHANGE FOR MOBILE: Wait for camera to stop before UI changes
            html5QrCode
              .stop()
              .then(() => {
                readerDiv.classList.add("hidden");
                // Now that camera is dead, show the data
                fetchFoodData(String(decodedText).trim());
              })
              .catch((err) => {
                console.error("Stop error:", err);
                // Fallback if stop fails
                fetchFoodData(String(decodedText).trim());
              });
          })
          .catch((err) => {
            console.error("Camera Error:", err);
            alert("Make sure you gave camera permission!");
          });
      }

      // Create a helper function to kill the camera
      // Helper function to stop the camera safely
      async function stopScanner() {
        const readerDiv = document.getElementById("barcode-reader");

        if (!html5QrCode) {
          readerDiv?.classList.add("hidden");
          return;
        }

        try {
          const state = html5QrCode.getState();

          // 2 = scanning, 3 = paused
          if (state === 2 || state === 3) {
            await html5QrCode.stop();
          }
        } catch (error) {
          console.warn("Scanner was already stopped:", error);
        }

        try {
          html5QrCode.clear();
        } catch (error) {
          console.warn("Scanner clear skipped:", error);
        }

        html5QrCode = null;
        readerDiv?.classList.add("hidden");
      }

      // Handle Manual Calories
      function saveManualCalories() {

        if (amount > 0) {

          localStorage.setItem("totalCaloriesEaten", totalCaloriesEaten);

          // Sync to Predictor
          const calPredictorInput = document.getElementById("caloriesInput");
          if (calPredictorInput) {
            calPredictorInput.value = Math.round(totalCaloriesEaten);
            if (typeof runPredictor === "function") runPredictor();
          }

          updateEatUI();
          input.value = "";
        }

        toggleEatModal(); // This runs no matter what!
      }

      function updateEatUI() {
        // 1. Pull the most recent idealCal from memory if it exists
        const savedGoal = localStorage.getItem("userIdealCal");
        if (savedGoal) idealCal = parseFloat(savedGoal);

        // 2. Update the text: "0 / 2450 kcal"
        const textLabel = document.getElementById("currentCalText");
        if (textLabel) {
          textLabel.innerText = `${Math.round(totalCaloriesEaten)} / ${Math.round(idealCal)} kcal`;
        }

        // 3. Update the bar width & Ring
        const progressBar = document.getElementById("eatProgressBar");
        let percentage = Math.min((totalCaloriesEaten / idealCal) * 100, 100);

        if (progressBar) {
          progressBar.style.width = percentage + "%";

          const borderDesktop = document.getElementById("eatBorderDesktop");
          if (borderDesktop) {
            borderDesktop.style.background = `conic-gradient(#22c55e 0% ${percentage}%, #3b82f6 ${percentage}%, #a855f7 100%)`;
          }
        }

        // 4. SYNC WITH PREDICTOR PAGE
        const predictorInput = document.getElementById("caloriesInput");
        // Only update the input if the user is NOT currently typing in it
        if (predictorInput && document.activeElement !== predictorInput) {
          predictorInput.value = Math.round(totalCaloriesEaten);
        }
      }

      let tempKcalPer100 = 0; // Temp storage
      let tempProductName = "";

      function fetchFoodData(barcode) {
        barcode = String(barcode).trim();

        console.log("Fetching food data for:", barcode);

        const apiUrl = `https://world.openfoodfacts.org/api/v2/product/${barcode}.json`;

        console.log("Request URL:", apiUrl);

        // Safety check: ensure result card exists
        const resultCard = document.getElementById("scan-result-card");
        if (!resultCard) {
          console.error("HTML Error: 'scan-result-card' not found.");
          return;
        }

        fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`)
          .then((res) => res.json())
          .then((data) => {
            console.log("API status:", data.status);
            console.log("API code:", data.code);
            if (data.status === 1) {
              const product = data.product;

              // 1. Store data globally for the 'Add' button to use later
              tempKcalPer100 =
                product.nutriments["energy-kcal_100g"] ||
                product.nutriments["energy-kj_100g"] / 4.184 ||
                0;
              tempProductName = product.product_name || "Unknown Product";

              // 2. Update the Result Card Text
              document.getElementById("res-name").innerText = tempProductName;
              document.getElementById("res-info").innerText =
                `${Math.round(tempKcalPer100)} kcal / 100g`;

              // 3. Hide Menu Buttons
              const scanBtn = document.getElementById("scanBtn");
              const manualDiv =
                document.getElementById("manualCalInput")?.parentElement;

              if (scanBtn) scanBtn.classList.add("hidden");
              if (manualDiv) manualDiv.classList.add("hidden");

              // 4. SHOW THE CARD (Using both methods for mobile safety)
              resultCard.classList.remove("hidden");
              resultCard.style.display = "block";

              console.log(
                "Success: Result card displayed for " + tempProductName,
              );
            } else {
              alert("Product not found in food database.");
              // Reset UI so user can try again
              toggleEatModal();
            }
          })
          .catch((err) => {
            console.error("API Error:", err);
            alert("Connection error. Check your internet!");
          });
      }

      function confirmScanAdd() {
        const gramsInput = document.getElementById("res-grams");
        const grams = parseFloat(gramsInput.value) || 0;

        if (grams > 0) {
          const finalKcal = Math.round((tempKcalPer100 / 100) * grams);

          totalCaloriesEaten += finalKcal;
          localStorage.setItem("totalCaloriesEaten", totalCaloriesEaten);

          updateEatUI();

          // 1. Alert the user
          alert(`Added ${finalKcal} kcal!`);

          // 2. Close the modal (this will also trigger the UI reset logic)
          toggleEatModal();
        } else {
          alert("Please enter grams!");
        }
      }

      async function cancelScanner() {
        await stopScanner();

        const modal = document.getElementById("eatModal");

        if (modal) {
          modal.classList.add("hidden");
          modal.classList.remove("flex");
        }
      }

      const TRACKER_STORAGE_KEY = "fuelLogTrackerData";

      let trackerSavedElements = [];
      let trackerSavedDate = trackerTodayKey();

      function trackerTodayKey() {
        const date = new Date();

        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(
          2,
          "0",
        )}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function trackerGetValue(element) {
        return "value" in element ? element.value : element.textContent.trim();
      }

      function trackerSetValue(element, value) {
        if ("value" in element) {
          element.value = value;
        } else {
          element.textContent = value;
        }
      }

      function saveTrackerData() {
        const data = {
          date: trackerTodayKey(),
        };

        trackerSavedElements.forEach((element) => {
          const key = element.dataset.save;
          data[key] = trackerGetValue(element);
        });

        localStorage.setItem(TRACKER_STORAGE_KEY, JSON.stringify(data));
      }

      function resetTrackerDailyFields() {
        trackerSavedElements.forEach((element) => {
          if (element.hasAttribute("data-daily")) {
            trackerSetValue(element, "0");
          }
        });

        trackerSavedDate = trackerTodayKey();
        saveTrackerData();
      }

      function loadTrackerData() {
        trackerSavedElements = [...document.querySelectorAll("[data-save]")];

        let savedData = {};

        try {
          savedData =
            JSON.parse(localStorage.getItem(TRACKER_STORAGE_KEY)) || {};
        } catch (error) {
          console.warn("Could not load saved tracker data:", error);
        }

        const today = trackerTodayKey();

        if (savedData.date && savedData.date !== today) {
          // New day: reset only fields marked data-daily
          trackerSavedElements.forEach((element) => {
            if (element.hasAttribute("data-daily")) {
              trackerSetValue(element, "0");
            }
          });
        } else {
          // Same day: restore saved values
          trackerSavedElements.forEach((element) => {
            const key = element.dataset.save;

            if (savedData[key] !== undefined) {
              trackerSetValue(element, savedData[key]);
            }
          });
        }

        trackerSavedDate = today;

        trackerSavedElements.forEach((element) => {
          element.addEventListener("input", saveTrackerData);
          element.addEventListener("change", saveTrackerData);
        });

        saveTrackerData();
      }

      function checkTrackerDate() {
        const today = trackerTodayKey();

        if (today !== trackerSavedDate) {
          resetTrackerDailyFields();
        }
      }

      loadTrackerData();

      // Checks whether midnight has passed while the app is open
      setInterval(checkTrackerDate, 30000);
    </script>

                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-meat"
              >
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path
                  d="M13.62 8.382l1.966 -1.967a2 2 0 1 1 3.414 -1.415a2 2 0 1 1 -1.413 3.414l-1.82 1.821"
                />
                <path
                  d="M5.904 18.596c2.733 2.734 5.9 4 7.07 2.829c1.172 -1.172 -.094 -4.338 -2.828 -7.071c-2.733 -2.734 -5.9 -4 -7.07 -2.829c-1.172 1.172 .094 4.338 2.828 7.071"
                />
                <path d="M7.5 16l1 1" />
                <path
                  d="M12.975 21.425c3.905 -3.906 4.855 -9.288 2.121 -12.021c-2.733 -2.734 -8.115 -1.784 -12.02 2.121"
                />
              </svg>
            </div>
            <h2 class="text-xl font-bold text-white text-center">Fuel Log</h2>
            <p class="text-slate-500 text-xs">Energy Intake (kcal)</p>
          </div>

          <!-- Manual Input Section (Matching your design) -->
          <div class="space-y-4 mb-6">
            <div
              class="bg-slate-800/50 rounded-2xl p-4 border border-slate-800"
            >
              <input
                type="number"
                id="manualCalInput"
                placeholder="Add extra kcal"
                class="w-full bg-transparent text-center text-lg font-bold text-white placeholder:text-slate-600 outline-none"
              />
            </div>

            <button
              id="scanBtn"
              onclick="startScanner()"
              class="w-full py-3 bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded-2xl text-sm font-medium transition-all flex items-center justify-center gap-2"
            >
              <i class="fas fa-barcode"></i> Open Scanner
            </button>
          </div>

          <!-- Weight -->
          <div
            id="scan-result-card"
            class="hidden mt-4 mb-6 p-4 bg-slate-800/50 rounded-2xl p-4 border border-slate-800 text-center"
          >
            <h4 id="res-name" class="text-white font-bold text-lg">
              Product Name
            </h4>
            <p id="res-info" class="text-gray-400 text-sm mb-3">
              510 kcal / 100g
            </p>

            <div class="flex flex-col gap-2">
              <input
                type="number"
                id="res-grams"
                placeholder="Grams eaten (e.g. 50)"
                class="w-full p-2 rounded bg-gray-900 text-white border border-gray-700 focus:outline-none focus:border-blue-500"
              />

              <button
                onclick="confirmScanAdd()"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded transition"
              >
                Add Calories
              </button>
            </div>
          </div>

          <!-- Bottom Actions -->
          <div class="flex gap-3">
            <button
              onclick="cancelScanner()"
              class="flex-1 py-3 text-slate-400 font-bold hover:text-white transition-all"
            >
              Cancel
            </button>
            <button
              onclick="saveManualCalories()"
              class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-bold shadow-lg shadow-green-900/20 active:scale-95 transition-all"
            >
              Save
            </button>
          </div>

          <!-- Hidden Scanner Viewport (Shows only when active) -->
          <div
            id="barcode-reader"
            class="hidden w-full aspect-square mt-4 rounded-2xl bg-black overflow-hidden border border-slate-700"
          ></div>
        </div>
      </div>
    </div>

    <!-- Explanation Modal -->
    <div
      id="infoModal"
      class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-[100] p-4"
    >
      <div
        class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl"
      >
        <h3 id="modalTitle" class="text-xl font-bold text-white mb-2">
          Ideal Explanation
        </h3>
        <p id="modalBody" class="text-slate-300 text-sm leading-relaxed mb-6">
          Explanation text goes here...
        </p>
        <button
          onclick="closeModal()"
          class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all"
        >
          Close
        </button>
      </div>
    </div>
  </body>
</html>
