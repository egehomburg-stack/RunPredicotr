
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Predictor JS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body class="bg-slate-900 text-white font-sans p-6">

    <div class="max-w-md mx-auto bg-slate-800 rounded-3xl p-8 shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-bold mb-2 flex items-center gap-2">🏃 Run Predictor</h1>
        <p class="text-slate-400 mb-8 text-sm">JavaScript Version</p>

        <!-- Inputs -->
        <div class="space-y-6">
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-500 mb-2">Sleep (hours)</label>
                <input type="number" id="sleep" value="8" step="0.1" class="w-full bg-slate-700 border-none rounded-lg p-3 focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-500 mb-2">Temp (°C)</label>
                <input type="number" id="temp" value="20" class="w-full bg-slate-700 border-none rounded-lg p-3 focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="flex items-center gap-4">
                <input type="checkbox" id="stretch" class="w-5 h-5 accent-blue-500">
                <label class="text-sm">Did you stretch today?</label>
            </div>

            <button onclick="calculate()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold transition-all active:scale-95 shadow-lg shadow-blue-900/20">
                Predict Run Quality
            </button>
        </div>

        <!-- Results -->
        <div id="result-box" class="mt-8 hidden animate-in fade-in duration-500">
            <div class="text-center">
                <span class="text-slate-400 text-sm">Predicted Quality</span>
                <div id="score" class="text-6xl font-black text-blue-400 my-2">0%</div>
            </div>
            <canvas id="myChart" class="mt-6"></canvas>
        </div>
    </div>

    <script>
        let myChart;

        function calculate() {
            // Get values from screen
            const sleep = parseFloat(document.getElementById('sleep').value);
            const temp = parseFloat(document.getElementById('temp').value);
            const stretch = document.getElementById('stretch').checked;

            // The Math (Same as Python)
            let score = (sleep * 5) + (stretch ? 15 : 0) - Math.abs(temp - 15);
            let finalScore = Math.min(100, Math.max(0, Math.round(score + 40)));

            // Show result
            document.getElementById('result-box').classList.remove('hidden');
            document.getElementById('score').innerText = finalScore + "%";

            // Update Graph
            updateChart(sleep, temp, stretch ? 15 : 0);
        }

        function updateChart(sleep, temp, stretch) {
    const ctx = document.getElementById('myChart').getContext('2d');
    if (myChart) myChart.destroy();

    // 1. Define Max Limits
    const sleepMax = 12;
    const tempMax = 40;
    const stretchMax = 1;

    // 2. Normalize to percentages (0-100)
    const sleepPercent = (sleep / sleepMax) * 100;
    const tempPercent = (temp / tempMax) * 100;
    const stretchPercent = (stretch > 0 ? 1 : 0) * 100;

    // 3. Define Ideals as percentages
    const idealSleep = (8 / sleepMax) * 100;
    const idealTemp = (20 / tempMax) * 100;
    const idealStretch = 100;

    myChart = new Chart(ctx, {
        type: 'polarArea',
        data: {
            labels: ['Sleep', 'Temperature', 'Stretching'],
            datasets: [
                {
                    label: 'Actual',
                    data: [sleepPercent, tempPercent, stretchPercent],
                    backgroundColor: ['rgba(59, 130, 246, 0.8)', 'rgba(239, 68, 68, 0.8)', 'rgba(16, 185, 129, 0.8)'],
                    borderColor: '#000000', // Black border
                    borderWidth: 2,
                    z: 2, // Highest layer: Covers everything
                    realValues: [sleep + 'h / 24h', temp + '°C / 40°C', stretch > 0 ? 'Yes' : 'No']
                },
                {
                    label: 'Ideal',
                    data: [idealSleep, idealTemp, idealStretch],
                    backgroundColor: ['rgba(147, 197, 253, 0.2)', 'rgba(252, 165, 165, 0.2)', 'rgba(110, 231, 183, 0.2)'],
                    borderColor: '#000000', // Changed to Black border
                    borderWidth: 1,
                    borderDash: [5, 5],
                    z: 1 // Middle layer: Covers grid, but sits under Actual
                }
            ]
        },
        options: {
            scales: {
                r: {
                    suggestedMax: 100,
                    ticks: { display: false },
                    grid: {
                        color: 'rgba(255, 255, 255, 0.5)',
                        z: 0 // Lowest layer: Behind the colored areas
                    },
                    angleLines: {
                        color: 'rgba(255, 255, 255, 0.2)',
                        z: 0
                    },
                    pointLabels: {
                        display: true,
                        centerPointLabels: true,
                        color: '#ffffff',
                        font: { size: 14 }
                    }
                }
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            if (context.datasetIndex === 0) {
                                return context.chart.data.labels[context.dataIndex] + ': ' + context.dataset.realValues[context.dataIndex];
                            }
                            return 'Goal Target';
                        }
                    }
                }
            }
        }
    });
}

    </script>
</body>
</html>
